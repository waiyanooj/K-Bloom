<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>All Perfumes | K-Bloom</title><link rel="stylesheet" href="./style.css"></head>
<body class="catalog-page"><nav class="catalog-nav" aria-label="Catalog navigation"><a href="./index.html">? K-Bloom Home</a><span>THE FRAGRANCE EDIT</span></nav>

    <section id="product" class="products-section" aria-labelledby="products-title">
      <div class="products-shell">
        <div class="products-heading">
          <div><p class="products-eyebrow">THE K-BLOOM COLLECTION</p>
            <h2 id="products-title">All fragrances.</h2>
            <p class="products-intro">A little floral, a little fresh. Entirely you.</p>
          </div>
          <a class="products-all" href="./index.html#product">Back to collection ?</a>
        </div>
        <div class="product-categories" aria-label="Perfume categories"></div>
        <div class="products-toolbar"><p class="products-count" aria-live="polite"></p>
          <div class="products-arrows"><button type="button" data-scroll="-1" aria-label="Previous products">?</button><button type="button" data-scroll="1" aria-label="Next products">?</button></div>
        </div>
        <div class="product-list" tabindex="0" role="region" aria-label="Perfumes, scroll horizontally"></div>
        <p class="products-note">Discover your next favourite ? Scroll to explore <span aria-hidden="true">?</span></p>
        <p class="products-status" role="status"></p>
      </div>
    </section>
    <dialog class="rating-dialog" aria-labelledby="rating-title">
      <form method="dialog"><button class="rating-close" aria-label="Close rating">?</button></form>
      <p class="products-eyebrow">YOUR OPINION MATTERS</p><h2 id="rating-title">Rate this fragrance</h2>
      <p class="rating-product"></p><div class="rating-options" aria-label="Choose your rating"></div>
      <p class="rating-help">Choose a star to save your rating on this device.</p>
    </dialog>

<script src="./products.js"></script></body></html>
